<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="Konichiwa, I am Mohammed Shoaib Choudry, techpreneur, product builder and explorer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <style>
      .rise { opacity:0; transform:translateY(16px); animation:rise .85s cubic-bezier(.2,.7,.3,1) forwards; }
      @keyframes rise { to { opacity:1; transform:translateY(0);} }
      .d1{animation-delay:.08s} .d2{animation-delay:.30s} .d3{animation-delay:.52s} .d4{animation-delay:.70s}

      .sweep { transform:scaleX(0); transform-origin:64px 50%;
               animation:sweep 1.05s cubic-bezier(.2,.7,.3,1) .55s forwards; }
      @keyframes sweep { to { transform:scaleX(1);} }

      .blink { animation:blink 1.2s steps(1) 1.3s infinite; }
      @keyframes blink { 0%,55%{opacity:1} 56%,100%{opacity:0} }

      /* live activity bars: continuous, staggered, never resolves */
      .bar { transform-box:fill-box; transform-origin:50% 100%;
             animation:eq 1.5s ease-in-out infinite; }
      @keyframes eq { 0%,100%{transform:scaleY(.22)} 50%{transform:scaleY(1)} }
      .b1{animation-duration:1.30s;animation-delay:.00s}
      .b2{animation-duration:1.75s;animation-delay:.18s}
      .b3{animation-duration:1.10s;animation-delay:.34s}
      .b4{animation-duration:2.00s;animation-delay:.10s}
      .b5{animation-duration:1.45s;animation-delay:.46s}
      .b6{animation-duration:1.65s;animation-delay:.26s}
      .b7{animation-duration:1.20s;animation-delay:.58s}
      .b8{animation-duration:1.90s;animation-delay:.06s}

      .float { animation:float 4.5s ease-in-out infinite alternate; }
      .f2{animation-delay:.9s} .f3{animation-delay:1.8s}
      @keyframes float { to { transform:translateY(-11px);} }

      .drift { animation:drift 12s ease-in-out infinite alternate; }
      @keyframes drift { to { transform:translate(20px,-8px);} }

      .hi   { font:400 33px 'Segoe Script','Bradley Hand','Snell Roundhand','Brush Script MT',cursive;
              fill:#f97316; }
      .name { font:700 46px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
              fill:#fafafa; letter-spacing:-1.3px; }
      .role { font:600 13px ui-monospace,'SF Mono',Menlo,Consolas,monospace;
              fill:#a1a1aa; letter-spacing:2.6px; }
      .sub  { font:400 16.5px 'Segoe UI',Helvetica,Arial,sans-serif; fill:#71717a; }
    </style>
  </defs>

  <rect width="900" height="268" fill="#0a0a0a"/>
  <g class="drift"><circle cx="812" cy="46" r="170" fill="url(#glow)" opacity="0.12"/></g>

  <!-- live signal bars -->
  <g transform="translate(690,72)">
    <rect class="bar b1" x="0"   y="0"  width="9" height="112" rx="4.5" fill="url(#bar)"/>
    <rect class="bar b2" x="17"  y="0"  width="9" height="112" rx="4.5" fill="url(#bar)"/>
    <rect class="bar b3" x="34"  y="0"  width="9" height="112" rx="4.5" fill="url(#bar)"/>
    <rect class="bar b4" x="51"  y="0"  width="9" height="112" rx="4.5" fill="url(#bar)"/>
    <rect class="bar b5" x="68"  y="0"  width="9" height="112" rx="4.5" fill="url(#bar)"/>
    <rect class="bar b6" x="85"  y="0"  width="9" height="112" rx="4.5" fill="url(#bar)"/>
    <rect class="bar b7" x="102" y="0"  width="9" height="112" rx="4.5" fill="url(#bar)"/>
    <rect class="bar b8" x="119" y="0"  width="9" height="112" rx="4.5" fill="url(#bar)"/>
    <rect x="-6" y="118" width="140" height="1.5" rx="1" fill="#f97316" opacity="0.28"/>
  </g>

  <!-- drifting particles -->
  <circle class="float"    cx="648" cy="60"  r="3.4" fill="#f97316" opacity="0.75"/>
  <circle class="float f2" cx="852" cy="212" r="2.6" fill="#fdba74" opacity="0.6"/>
  <circle class="float f3" cx="626" cy="196" r="2.2" fill="#f97316" opacity="0.5"/>

  <text class="hi rise d1"   x="64" y="76">Konichiwa!</text>
  <text class="name rise d2" x="64" y="136">Mohammed Shoaib Choudry</text>
  <rect class="sweep" x="64" y="156" width="168" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="role rise d3" x="64" y="192">TECHPRENEUR / PRODUCT BUILDER / EXPLORER</text>
  <text class="sub  rise d4" x="64" y="224">Tech products and MVPs, taken from idea to shipped.</text>
  <rect class="blink" x="64" y="240" width="10" height="3" fill="#f97316"/>
</svg>
