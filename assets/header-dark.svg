<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="Konichiwa, I am Mohammed Shoaib Choudry, techpreneur and product builder">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <style>
      .rise { opacity:0; transform:translateY(16px); animation:rise .85s cubic-bezier(.2,.7,.3,1) forwards; }
      @keyframes rise { to { opacity:1; transform:translateY(0);} }
      .d1{animation-delay:.08s} .d2{animation-delay:.30s} .d3{animation-delay:.52s} .d4{animation-delay:.70s}

      .sweep { transform:scaleX(0); transform-origin:64px 50%;
               animation:sweep 1.05s cubic-bezier(.2,.7,.3,1) .55s forwards; }
      @keyframes sweep { to { transform:scaleX(1);} }

      .blink { animation:blink 1.2s steps(1) 1.3s infinite; }
      @keyframes blink { 0%,55%{opacity:1} 56%,100%{opacity:0} }

      .pulse { animation:pulse 2.6s ease-in-out infinite; }
      .p2{animation-delay:.35s} .p3{animation-delay:.7s} .p4{animation-delay:1.05s} .p5{animation-delay:1.4s}
      @keyframes pulse { 0%,100%{opacity:.22; r:3} 50%{opacity:1; r:4.2} }

      .trace { stroke-dasharray:190; stroke-dashoffset:190;
               animation:trace 2.4s ease-out .8s forwards; }
      @keyframes trace { to { stroke-dashoffset:0; } }

      .drift { animation:drift 11s ease-in-out infinite alternate; }
      @keyframes drift { to { transform:translate(22px,-10px);} }

      .hi   { font:400 33px 'Segoe Script','Bradley Hand','Snell Roundhand','Brush Script MT',cursive;
              fill:#f97316; }
      .name { font:700 46px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
              fill:#fafafa; letter-spacing:-1.3px; }
      .role { font:600 13px ui-monospace,'SF Mono',Menlo,Consolas,monospace;
              fill:#a1a1aa; letter-spacing:2.6px; }
      .sub  { font:400 16.5px 'Segoe UI',Helvetica,Arial,sans-serif; fill:#71717a; }
    </style>
  </defs>

  <rect width="900" height="268" fill="#0a0a0a"/>
  <g class="drift"><circle cx="806" cy="52" r="165" fill="url(#glow)" opacity="0.13"/></g>
  <rect x="0" y="0" width="4" height="268" fill="url(#accent)"/>

  <!-- circuit motif: nodes wired together, drawn in then pulsing -->
  <g transform="translate(676,58)" opacity="0.9">
    <path class="trace" d="M8 8 H92 V56 H150 M8 8 V72 H60 V120 H150 M92 56 V104"
          fill="none" stroke="#f97316" stroke-opacity="0.42" stroke-width="1.6"/>
    <circle class="pulse"    cx="8"   cy="8"   r="3" fill="#f97316"/>
    <circle class="pulse p2" cx="92"  cy="56"  r="3" fill="#f97316"/>
    <circle class="pulse p3" cx="150" cy="56"  r="3" fill="#fdba74"/>
    <circle class="pulse p4" cx="60"  cy="120" r="3" fill="#f97316"/>
    <circle class="pulse p5" cx="150" cy="120" r="3" fill="#fdba74"/>
    <circle class="pulse p3" cx="92"  cy="104" r="3" fill="#f97316"/>
  </g>

  <text class="hi rise d1"   x="64" y="76">Konichiwa!</text>
  <text class="name rise d2" x="64" y="136">Mohammed Shoaib Choudry</text>
  <rect class="sweep" x="64" y="156" width="168" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="role rise d3" x="64" y="192">TECHPRENEUR / PRODUCT BUILDER / CO-FOUNDER</text>
  <text class="sub  rise d4" x="64" y="224">Tech products and MVPs, taken from idea to shipped.</text>
  <rect class="blink" x="64" y="240" width="10" height="3" fill="#f97316"/>
</svg>
