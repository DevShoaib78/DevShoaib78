<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="Konichiwa, I am Mohammed Shoaib Choudry, techpreneur, product builder and tinkerer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <style>
      .rise { opacity:0; transform:translateY(16px); animation:rise .85s cubic-bezier(.2,.7,.3,1) forwards; }
      @keyframes rise { to { opacity:1; transform:translateY(0);} }
      .d1{animation-delay:.08s} .d2{animation-delay:.30s} .d3{animation-delay:.52s} .d4{animation-delay:.70s}

      .sweep { transform:scaleX(0); transform-origin:64px 50%;
               animation:sweep 1.05s cubic-bezier(.2,.7,.3,1) .55s forwards; }
      @keyframes sweep { to { transform:scaleX(1);} }

      .cursor { fill:#f97316; animation:blink 1.15s steps(1) 1.5s infinite; }
      @keyframes blink { 0%,55%{opacity:1} 56%,100%{opacity:0} }

      /* left rule, emitting outward */
      .emit { transform-box:fill-box; transform-origin:0% 50%;
              animation:emit 3.4s ease-out infinite; }
      @keyframes emit { 0%{transform:scaleX(1);opacity:.45} 100%{transform:scaleX(14);opacity:0} }

      /* a product assembling itself: nodes land, links wire up, then it rebuilds */
      .node { transform-box:fill-box; transform-origin:50% 50%; opacity:0;
              animation:node 6.5s ease-in-out infinite; }
      @keyframes node {
        0%{opacity:0;transform:scale(0)} 10%{opacity:1;transform:scale(1.25)}
        14%{transform:scale(1)} 80%{opacity:1;transform:scale(1)}
        92%{opacity:0;transform:scale(.3)} 100%{opacity:0;transform:scale(0)} }
      .n2{animation-delay:.28s} .n3{animation-delay:.52s}
      .n4{animation-delay:.78s} .n5{animation-delay:1.02s} .n6{animation-delay:.06s}

      .link { stroke-dasharray:62; stroke-dashoffset:62;
              animation:link 6.5s ease-in-out infinite; }
      @keyframes link {
        0%{stroke-dashoffset:62;opacity:0} 8%{opacity:.55}
        26%{stroke-dashoffset:0;opacity:.55} 80%{stroke-dashoffset:0;opacity:.55}
        92%{opacity:0} 100%{stroke-dashoffset:62;opacity:0} }
      .l2{animation-delay:.30s} .l3{animation-delay:.54s}
      .l4{animation-delay:.80s} .l5{animation-delay:1.04s}
      .l6{animation-delay:1.24s} .l7{animation-delay:1.40s}

      .spin { animation:spin 11s linear infinite; transform-origin:0 0; }
      @keyframes spin { to { transform:rotate(360deg);} }

      .drift { animation:drift 12s ease-in-out infinite alternate; }
      @keyframes drift { to { transform:translate(18px,-8px);} }

      .hi   { font:400 33px 'Segoe Script','Bradley Hand','Snell Roundhand','Brush Script MT',cursive;
              fill:#f97316; }
      .name { font:700 46px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
              fill:#fafafa; letter-spacing:-1.3px; }
      .role { font:600 13px ui-monospace,'SF Mono',Menlo,Consolas,monospace;
              fill:#a1a1aa; letter-spacing:2.6px; }
      .sub  { font:400 16.5px 'Segoe UI',Helvetica,Arial,sans-serif; fill:#71717a; }
    </style>
  </defs>

  <rect width="900" height="268" fill="#0a0a0a"/>
  <g class="drift"><circle cx="812" cy="46" r="170" fill="url(#glow)" opacity="0.11"/></g>

  <rect class="emit" x="0" y="0" width="4" height="268" fill="#f97316"/>
  <rect x="0" y="0" width="4" height="268" fill="url(#accent)"/>

  <g stroke="#f97316" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path class="link"    d="M764 130 L762 82"/>
    <path class="link l2" d="M764 130 L716 118"/>
    <path class="link l3" d="M764 130 L806 110"/>
    <path class="link l4" d="M764 130 L740 166"/>
    <path class="link l5" d="M764 130 L808 162"/>
    <path class="link l6" d="M716 118 L740 166"/>
    <path class="link l7" d="M806 110 L808 162"/>
  </g>
  <g>
    <circle class="node n6" cx="764" cy="130" r="5.5" fill="#fdba74"/>
    <circle class="node"    cx="762" cy="82"  r="4"   fill="#f97316"/>
    <circle class="node n2" cx="716" cy="118" r="4"   fill="#f97316"/>
    <circle class="node n3" cx="806" cy="110" r="4"   fill="#f97316"/>
    <circle class="node n4" cx="740" cy="166" r="4"   fill="#f97316"/>
    <circle class="node n5" cx="808" cy="162" r="4"   fill="#f97316"/>
  </g>
  <g transform="translate(764,130)">
    <g class="spin"><circle cx="86" cy="0" r="3.2" fill="#fdba74" opacity="0.85"/></g>
  </g>

  <text class="hi rise d1"   x="64" y="76">Konichiwa!</text>
  <text class="name rise d2" x="64" y="136">Mohammed Shoaib Choudry</text>
  <rect class="sweep" x="64" y="156" width="168" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="role rise d3" x="64" y="192">TECHPRENEUR / PRODUCT BUILDER / TINKERER</text>
  <text class="sub rise d4"  x="64" y="226">Tech products and MVPs, taken from idea to shipped<tspan class="cursor" dx="7">&#9612;</tspan></text>
</svg>
