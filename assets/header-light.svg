<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Shoaib Choudry — building products for web and mobile">
  <defs>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <style>
      .rise    { opacity: 0; transform: translateY(14px); animation: rise .8s cubic-bezier(.2,.7,.3,1) forwards; }
      .d1 { animation-delay: .10s } .d2 { animation-delay: .28s }
      .d3 { animation-delay: .46s } .d5 { animation-delay: .70s }
      .d6 { animation-delay: .80s } .d7 { animation-delay: .90s }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }

      .sweep   { transform: scaleX(0); transform-origin: 64px 50%;
                 animation: sweep 1.1s cubic-bezier(.2,.7,.3,1) .5s forwards; }
      @keyframes sweep { to { transform: scaleX(1); } }

      .blink   { animation: blink 1.15s steps(1) 1.2s infinite; }
      @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }

      .drift   { animation: drift 9s ease-in-out infinite alternate; }
      @keyframes drift { to { transform: translateX(26px); } }

      .name    { font: 700 56px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
                 fill: #0a0a0a; letter-spacing: -1.6px; }
      .role    { font: 400 21px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; fill: #52525b; }
      .meta    { font: 600 12.5px ui-monospace,'SF Mono',Menlo,Consolas,monospace;
                 fill: #71717a; letter-spacing: 1.4px; }
      .tag     { font: 600 12px 'Segoe UI',Helvetica,Arial,sans-serif; fill: #c2410c; letter-spacing: .6px; }
    </style>
  </defs>

  <rect width="900" height="240" fill="#ffffff"/>
  <g class="drift" opacity="0.6">
    <circle cx="792" cy="60" r="150" fill="url(#fadeL)" opacity="0.16"/>
  </g>
  <rect x="0" y="0" width="4" height="240" fill="url(#accentL)"/>

  <text class="name rise d1" x="64" y="106">Shoaib Choudry</text>

  <rect class="sweep" x="64" y="126" width="150" height="3" rx="1.5" fill="url(#accentL)"/>

  <text class="role rise d2" x="64" y="164">Building products for web and mobile — interface, code and deployment.</text>

  <g class="rise d3">
    <text class="meta" x="64" y="200">HYDERABAD, INDIA</text>
    <text class="meta" x="238" y="200">·</text>
    <text class="meta" x="258" y="200">CO-FOUNDER, ONETHING STUDIO</text>
  </g>

  <g transform="translate(640,186)">
    <rect class="rise d5" x="0"   y="0" width="60" height="22" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="tag rise d5" x="30" y="15" text-anchor="middle">React</text>
    <rect class="rise d6" x="68"  y="0" width="64" height="22" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="tag rise d6" x="100" y="15" text-anchor="middle">Next.js</text>
    <rect class="rise d7" x="140" y="0" width="62" height="22" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="tag rise d7" x="171" y="15" text-anchor="middle">Flutter</text>
  </g>

  <rect class="blink" x="64" y="216" width="9" height="3" fill="#ea580c"/>
</svg>
